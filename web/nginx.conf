server {
    listen 80;
    root /usr/share/nginx/html;

    # Compress JSON too: the municipalities GeoJSON shrinks to a fraction.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # API requests go to the api container. "api" is the compose service
    # name, which Docker's internal DNS resolves to that container.
    location /api/ {
        proxy_pass http://api:3000;
    }

    location / {
        try_files $uri /index.html;
    }
}
